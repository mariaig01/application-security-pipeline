# Exclusive disposable scanning environment. Never connect it to development data.
name: appsec-security
services:
  db:
    image: postgres:17.11-bookworm@sha256:639ab7ceb90e13123085b741fb31ef493fba25463002f6da665352e7b534b652
    environment:
      POSTGRES_USER: scan_test
      POSTGRES_PASSWORD: scan-test-only
      POSTGRES_DB: scan_test
    tmpfs: [/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, pg_isready -U scan_test -d scan_test]
      interval: 2s
      timeout: 3s
      retries: 30
  app:
    image: appsec-scan:local
    build:
      context: .
      target: runtime
    environment:
      APP_ENV: development
      SECRET_KEY: ${SCAN_SECRET_KEY:?Provided by security/scan.py}
      DATABASE_URL: postgresql+psycopg://scan_test:scan-test-only@db:5432/scan_test
      TRUSTED_HOSTS: app,localhost,127.0.0.1
    command: [sh, -c, "alembic upgrade head && exec gunicorn --bind 0.0.0.0:8000 'appsec_pipeline:create_app()'"]
    depends_on:
      db:
        condition: service_healthy
  zap:
    image: ghcr.io/zaproxy/zaproxy:2.17.0@sha256:9624669db72f54d86c4b46a7064518bd9bf79d8c61a4c31befa9923489f328af
    command: [zap.sh, -daemon, -host, 0.0.0.0, -port, '8080', -config, api.disablekey=true, -config, 'api.addrs.addr.name=.*', -config, api.addrs.addr.regex=true]
    ports: ["127.0.0.1:18082:8080"]
