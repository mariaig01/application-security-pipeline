name: application-security-pipeline

x-app: &app
  image: application-security-pipeline:local
  build:
    context: .
    target: runtime
  environment:
    APP_ENV: ${APP_ENV:-development}
    SECRET_KEY: ${SECRET_KEY:?Run python3 scripts/init_env.py first}
    DATABASE_URL: ${DATABASE_URL:?Run python3 scripts/init_env.py first}
    TRUSTED_HOSTS: ${TRUSTED_HOSTS:-localhost,127.0.0.1}
  read_only: true
  tmpfs:
    - /tmp:size=64m,mode=1777
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]

services:
  db:
    image: postgres:17.11-bookworm@sha256:639ab7ceb90e13123085b741fb31ef493fba25463002f6da665352e7b534b652
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-appsec_bootstrap}
      POSTGRES_DB: ${POSTGRES_DB:-appsec}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run python3 scripts/init_env.py first}
      DB_APP_PASSWORD: ${DB_APP_PASSWORD:?Run python3 scripts/init_env.py first}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init-app.sh:/docker-entrypoint-initdb.d/10-app-role.sh:ro
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 2s
      timeout: 3s
      retries: 30

  migrate:
    <<: *app
    command: [alembic, upgrade, head]
    depends_on:
      db:
        condition: service_healthy

  app:
    <<: *app
    ports:
      - "127.0.0.1:${APP_PORT:-8000}:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 5s
      timeout: 4s
      retries: 12

volumes:
  postgres-data:
