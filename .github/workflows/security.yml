name: Security
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true
jobs:
  scan:
    name: Security (${{ matrix.scanner }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        scanner: [semgrep, trivy, zap]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Verify blocking policies and isolated demonstration
        run: |
          python3 -m unittest discover -s security/tests -v
          python3 demos/idor.py
      - name: Scan and enforce policy
        run: python3 security/scan.py ${{ matrix.scanner }}
      - name: Store scanner report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: security-${{ matrix.scanner }}
          path: reports/${{ matrix.scanner }}*.json
          retention-days: 14
          if-no-files-found: warn
