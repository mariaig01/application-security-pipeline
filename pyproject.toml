[project]
name = "application-security-pipeline"
version = "0.1.0"
description = "Private documents API for learning Application Security and DevSecOps"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.16,<2",
    "click>=8.1,<9",
    "flask>=3.1,<4",
    "flask-login>=0.6.3,<0.8",
    "flask-wtf>=1.2.2,<2",
    "gunicorn>=23,<27",
    "psycopg[binary]>=3.2,<4",
    "sqlalchemy>=2.0.41,<2.1",
    "werkzeug>=3.1,<4",
]

[dependency-groups]
dev = ["pytest>=8.4,<10", "ruff>=0.12,<1"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
